<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../static/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
</head>

<body>

    <div class="d-flex flex-column min-vh-100">

        <nav class="navbar navbar-expand-lg bg-primary border-primary border-bottom">
            <div class="container-fluid my-1 mx-5">
                <a class="navbar-brand text-white fw-bold fs-5" href="#">
                    <i class="fa-solid fa-earth-americas"></i> TRAVEL RECOMMENDATION</a>
                <button class="navbar-toggler shadow-none border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars text-white"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold text-decoration-underline link-offset-2 active"
                                href="/predict">Prediction</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" aria-current="page" href="/upload">Upload</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="/forecast">Forecast</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="https://www.google.com/maps">google Maps</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white fw-bold" href="/logout">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>



        {% if success %}
        <div class="position-fixed top-0 toastae start-50 translate-middle-x p-3" style="z-index: 11">
            <div id="liveToast1" class="toast bg-success bg-opacity-75 hide" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body ms-auto text-white">
                        {{success}}
                    </div>
                    <button type="button" class="btn-close shadow-none btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>
        {% endif %}

        <div class="container bg-white my-4">

            <div class="d-flex mt-5 mb-3">
                <h3 class="text-primary-emphasis link-offset-1 text-decoration-underline flex-grow-1 flex-md-grow-0">
                    Prediction
                </h3>
            </div>

            <form method="post" id="predictform" enctype="multipart/form-data">

                <div class="row justify-content-center mb-3 mt-4 gx-5 gy-4">
                    


                    <div class="col-md-6 position-relative">
                        <label for="city" class="form-label">City:</label>
                        <select class="form-select shadow-none border-primary" name="city"
                            id="city">
                            <option selected value="">Select City</option> 
                            {% for i in city %}
                            <option value="{{i[0]}}">{{i[0]}}</option>
                            {% endfor %}
                        </select>
                        <div class="invalid-tooltip rounded-3 ">
                            * Select City
                        </div>
                    </div>
 


                    <div class="col-md-6 position-relative">
                        <label for="rating" class="form-label">Rating (maximum 5):</label>
                        <input type="number" class="form-control shadow-none border-primary" name="rating" id="rating" min="0" step="0.1" max="5" placeholder="Enter Rating">
                        <div class="invalid-tooltip rounded-3 ">
                            * Select Rating
                        </div>
                    </div>


                    <div class="col-md-6 position-relative">
                        <label for="distance" class="form-label">Distance:</label>
                        <input type="number" class="form-control shadow-none border-primary" name="distance" id="distance" min="0" placeholder="Enter Distance">
                        <div class="invalid-tooltip rounded-3 ">
                            * Select Distance
                        </div>
                    </div>
    
 

                    <div class="col-md-6">
                        <label for="price" class="form-label d-block">&nbsp;</label>
                        <div class="d-flex gap-4">
                            <button type="reset" id="reset" class="btn btn-danger shadow-none w-100">Reset</button>
                            <button type="submit" class="btn btn-success shadow-none w-100">Predict</button>
                        </div>
                    </div>
 

                </div>



            </form>

        </div>


    </div>

    <script src="../static/js/jquery.js"></script>
    <script src="../static/js/bootstrap.js"></script>


    <script>
        $(function () {

            $('.toast').toast('show');

           

            $("#predictform").on("submit", function (e) {
                debugger;

                var city = $("#city").val()
                var rating = $("#rating").val()
                var distance = $("#distance").val()  


                var testemail = new RegExp("[a-z0-9]+@[a-z]+\.[a-z]{2,3}");
                var testphone = new RegExp("^[6-9][0-9]{9}$");
                var testaadhar = new RegExp("^[2-9]{1}[0-9]{3}[0-9]{4}[0-9]{4}$");
                var testusn = new RegExp("(?=(.*[a-zA-Z])(?=.*[0-9]))"); 
 


                if (city != "") {
                    $("#city").removeClass("is-invalid");
                } else {
                    $("#city").addClass("is-invalid");
                    e.preventDefault();
                }

                if (rating != "") {
                    $("#rating").removeClass("is-invalid");
                } else {
                    $("#rating").addClass("is-invalid");
                    e.preventDefault();
                }

                if (distance != "") {
                    $("#distance").removeClass("is-invalid");
                } else {
                    $("#distance").addClass("is-invalid");
                    e.preventDefault();
                } 
 

            })

            $("input,textarea,select").on("keydown change", function () {
                $(this).removeClass("is-invalid")
            })

            $("#reset").on("click", function () {
                $("input,textarea,select").removeClass("is-invalid")  
            })

        })
    </script>

</body>


</html>
